name: Docker Publish

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - config/**
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/docker-publish.yml
      - Dockerfile
      - config/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Image
        run: docker build -t docker-php-alpine:test .

      - name: Start Container
        run: |
          docker run -d --name smoke -p 8080:80 docker-php-alpine:test
          echo '<?php echo "PHP OK";' | docker exec -i smoke sh -c 'cat > /var/www/html/test.php'

      - name: Verify PHP Serves Requests
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/test.php | grep -q 'PHP OK'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "Smoke test failed"
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  build-and-push-image:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          install: true

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
