[supervisord]
nodaemon=true
; Keep supervisord's own log and pid files out of the web root,
; where the default relative paths would put them
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
; The php-fpm binary is versioned (php-fpm82, php-fpm83, ...) and the
; package installs no versionless symlink, so locate it dynamically
command=sh -c 'exec $(ls /usr/sbin/php-fpm* | head -n 1) -F'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=false
startretries=0
